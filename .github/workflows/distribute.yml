name: Debug APK

on:
  workflow_dispatch:
    inputs:
      story:
        description: Story directory name (for example, iteration0)
        required: true
        type: string
      commit:
        description: Full 40-character commit SHA merged into the default branch
        required: true
        type: string

permissions:
  contents: read

# Serialize version allocation and APK creation, including reruns of older workflow runs.
concurrency:
  group: seasonal-debug-apk
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      commit: ${{ steps.target.outputs.commit }}
      story: ${{ steps.target.outputs.story }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the selected story and trusted commit
        id: target
        env:
          STORY: ${{ inputs.story }}
          TARGET_COMMIT: ${{ inputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          python3 scripts/distribution.py prepare
          --story "$STORY" --commit "$TARGET_COMMIT"
          --branch "$DEFAULT_BRANCH" --output "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Install Android SDK and enable KVM
        run: |
          sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0' 'emulator' 'platform-tools' 'system-images;android-36;aosp_atd;x86_64'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check all source and test tooling
        run: |
          npm ci
          npm run check:markdown
          npm run lint:markdown
          npm run test:quality
          python3 -m unittest discover -s tests
          python3 scripts/validate_data.py
          python3 scripts/distribution.py check-pending
          ./gradlew spotlessCheck :app:lintDebug :app:testDebugUnitTest :app:acceptanceTest -PincludePendingAcceptance=true -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: apk-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Install build SDK
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Restore the persistent signing key
        env:
          SEASONAL_DEBUG_KEYSTORE_BASE64: ${{ secrets.SEASONAL_DEBUG_KEYSTORE_BASE64 }}
        run: python3 scripts/distribution.py restore-key "$RUNNER_TEMP/seasonal-debug.jks"
      - name: Build the signed Debug APK
        id: build
        env:
          SEASONAL_DEBUG_STORE_PASSWORD: ${{ secrets.SEASONAL_DEBUG_STORE_PASSWORD }}
          SEASONAL_DEBUG_KEY_ALIAS: ${{ secrets.SEASONAL_DEBUG_KEY_ALIAS }}
          SEASONAL_DEBUG_KEY_PASSWORD: ${{ secrets.SEASONAL_DEBUG_KEY_PASSWORD }}
        run: |
          export SEASONAL_DEBUG_KEYSTORE_PATH="$RUNNER_TEMP/seasonal-debug.jks"
          VERSION_CODE="$(python3 scripts/distribution.py version-code)"
          git diff --exit-code
          git diff --cached --exit-code
          ./gradlew :app:assembleDebug -PdistributionBuild=true -PdistributionVersionCode="$VERSION_CODE" --no-configuration-cache
          git diff --exit-code
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Verify and identify the APK
        id: package
        env:
          STORY: ${{ needs.verify.outputs.story }}
          COMMIT: ${{ needs.verify.outputs.commit }}
          VERSION_CODE: ${{ steps.build.outputs.version_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SEASONAL_DEBUG_STORE_PASSWORD: ${{ secrets.SEASONAL_DEBUG_STORE_PASSWORD }}
          SEASONAL_DEBUG_KEY_ALIAS: ${{ secrets.SEASONAL_DEBUG_KEY_ALIAS }}
        run: |
          FILENAME="$(python3 scripts/distribution.py package --story "$STORY" --commit "$COMMIT" --version-code "$VERSION_CODE" --apk app/build/outputs/apk/debug/app-debug.apk --keystore "$RUNNER_TEMP/seasonal-debug.jks" --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --output-dir "$RUNNER_TEMP/apk-artifact" --run-url "$RUN_URL")"
          echo "artifact=${FILENAME%.apk}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ runner.temp }}/apk-artifact/
          if-no-files-found: error
          retention-days: 90
      - name: Remove the restored signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/seasonal-debug.jks"
